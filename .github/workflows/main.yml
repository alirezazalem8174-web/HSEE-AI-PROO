name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: List files to find gradlew
      run: |
        echo "Checking current directory structure:"
        ls -R

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle (Attempt 1)
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -f "HSE_AI_PRO_v4.4_GitHubBuildReady/gradlew" ]; then
          chmod +x HSE_AI_PRO_v4.4_GitHubBuildReady/gradlew
          ./HSE_AI_PRO_v4.4_GitHubBuildReady/gradlew assembleDebug
        else
          echo "ERROR: gradlew not found anywhere!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HSE-AI-PRO-Debug-APK
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          HSE_AI_PRO_v4.4_GitHubBuildReady/app/build/outputs/apk/debug/app-debug.apk
